services:
  ros_dev:
    build: .
    container_name: ros_pet_container
    restart: unless-stopped
    network_mode: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - TERM=xterm-256color
      - DISABLE_ROS1_EOL_WARNINGS=1
    volumes:
      - ~/repos:/home/dev/repos
      - ./catkin_ws:/home/dev/catkin_ws
      - ~/bag:/home/dev/bags
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./demo:/home/dev/demo
      - /media:/media:rw
    command: tail -f /dev/null

  converter:
    image: ghcr.io/comrob/ros_bag_converter:${BAGPIPE_IMAGE_TAG:-latest}
    build: .
    container_name: bag_converter_runner
    restart: "no"
    user: "${CURRENT_UID:-1000}:${CURRENT_GID:-1000}"
    # Data volumes and the working directory are supplied per invocation by
    # bagpipe, which mounts host paths at their own paths inside the container.
    volumes:
      - ./src:/home/dev/src
    command: python3 /home/dev/src/convert.py --help