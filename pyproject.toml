[project]
name = "bagpipe"
dynamic = ["version"]
description = "Pipelines over ROS bags: ROS1 -> ROS2 conversion and topic extraction from large MCAP recordings"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Resuming .part files reaches into mcap's Writer internals; keep to the
    # tested series (a newer one makes resume fall back to a fresh start).
    "mcap>=1.3.1,<1.4",
    "rosbags>=0.9.23",
    "numpy",
    "pyyaml",
    "tqdm",
    "zstandard",
    "lz4",
    # Only for the debayer plugins; headless wheels need no system libraries.
    "opencv-python-headless",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>[^\\s]+)"

[tool.hatch.build.targets.wheel]
packages = ["src/bagpipe"]

[tool.uv]
# The same interpreter everywhere, whatever Python the OS ships.
python-preference = "only-managed"
